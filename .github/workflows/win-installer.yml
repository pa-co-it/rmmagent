name: Build Windows client installer

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client ID'
        required: true
        default: '0'
      site:
        description: 'Site ID'
        required: true
        default: '0'
      api:
        description: 'API URL'
        required: true
        default: 'https://api.pa.co.it'
      token:
        description: 'Auth token (from TRMM Manual install method)'
        required: true
      agent_type:
        description: 'Agent type'
        type: choice
        options: [server, workstation]
        default: server
      rdp:
        description: 'Enable RDP (0/1)'
        type: choice
        options: ['0', '1']
        default: '0'
      ping:
        description: 'Enable ping (0/1)'
        type: choice
        options: ['0', '1']
        default: '0'
      power:
        description: 'Disable sleep/hibernate (0/1)'
        type: choice
        options: ['0', '1']
        default: '0'

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.13'

      - name: Build agent (unsigned)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\artifacts | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags "-s -w" -o build\artifacts\tacticalrmm.exe .
          Get-Item build\artifacts\tacticalrmm.exe | Select-Object Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile client installer
        shell: pwsh
        run: |
          .\build\build-installer.ps1 `
            -Client ${{ inputs.client }} `
            -Site ${{ inputs.site }} `
            -Api "${{ inputs.api }}" `
            -Token "${{ inputs.token }}" `
            -AgentType ${{ inputs.agent_type }} `
            -Rdp ${{ inputs.rdp }} `
            -Ping ${{ inputs.ping }} `
            -Power ${{ inputs.power }} `
            -AgentExe build\artifacts\tacticalrmm.exe

      - uses: actions/upload-artifact@v4
        with:
          name: installer-client-${{ inputs.client }}
          path: build/out/*.exe
          if-no-files-found: error
